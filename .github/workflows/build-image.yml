name: server-image

# 服务端代码/镜像相关改动推 main 自动构建并部署，不再依赖 v* 标签；
# 这样 iOS 发版 tag 不会误触发服务端镜像，App 改动也不会触发服务端部署。
# 需要手动发服务端版本时，推 server-v* 标签或走 workflow_dispatch。
# 首次上线前需要在 k3s-master 上先 apply 一次清单:
#   kubectl apply -f server/k8s.yaml
on:
  push:
    branches: [ main ]
    paths:
      - "server/hg/**"
      - "server/sign/**"
      - "server/resolver/**"
      - "server/Dockerfile"
      - "server/entrypoint.sh"
      - "server/k8s.yaml"
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "手动构建时用的镜像标签"
        required: false
        default: "manual"

env:
  IMAGE: crpi-p67sy5t6k9nsmste.cn-hangzhou.personal.cr.aliyuncs.com/gengbo/hongguo
  APP: hongguo
  NAMESPACE: dev

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 种子索引要从历史提交 4e4e266^ 里取，浅克隆拿不到
          fetch-depth: 0

      - name: 解析镜像标签
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: 检查签名材料
        run: |
          if [ -f server/sign/unidbg-sign.jar ]; then
            echo "已打包 unidbg 签名 jar"
          else
            echo "::warning::没有 server/sign/unidbg-sign.jar, 镜像里 /resolve 将无签名直连"
          fi

      # 种子索引被 .gitignore 排除（22MB），checkout 里没有；从历史提交里取回来。
      # 不取的话镜像里就没有 index.bin.z，首次启动库存 0 条，客户端开屏全空。
      - name: 取种子索引
        run: |
          mkdir -p server/seed
          git show 4e4e266^:ShortDramaBox/Sources/Resources/index.bin.z > server/seed/index.bin.z
          ls -l server/seed/index.bin.z
          test "$(wc -c < server/seed/index.bin.z)" -gt 20000000

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: crpi-p67sy5t6k9nsmste.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: 构建并推送镜像
        id: build
        run: |
          set +e
          TAG="${{ steps.meta.outputs.tag }}"
          docker build -f server/Dockerfile \
            -t "${{ env.IMAGE }}:$TAG" -t "${{ env.IMAGE }}:latest" . \
            > /tmp/docker-build.log 2>&1
          code=$?
          echo "===== 构建 exit=$code ====="
          tail -60 /tmp/docker-build.log
          if [ $code -ne 0 ]; then
            echo "--- 最后 400 行 ---" >> /tmp/docker-build.log
            cp /tmp/docker-build.log build-error.log
            exit $code
          fi
          docker push "${{ env.IMAGE }}:$TAG"
          docker push "${{ env.IMAGE }}:latest"

      # Actions 的日志 API 403，失败原因推到 ci-log 分支留档
      - name: 留档构建日志
        if: always()
        run: |
          {
            echo "=== server-image run ${GITHUB_RUN_NUMBER} tag=${GITHUB_REF_NAME} ==="
            tail -400 /tmp/docker-build.log 2>/dev/null || echo "没有构建日志"
          } > ShortDramaBox/build-error.log
          git config user.name "ci"
          git config user.email "ci@local"
          git checkout -B ci-log
          git add -f ShortDramaBox/build-error.log
          git commit -m "ci: 镜像构建日志 run ${GITHUB_RUN_NUMBER} [skip ci]" || true
          git push -f origin ci-log || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 在 k3s-master 上滚动更新
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K3S_HOST }}
          port: ${{ secrets.K3S_PORT }}
          username: ${{ secrets.K3S_USER }}
          key: ${{ secrets.K3S_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ env.IMAGE }}:${{ needs.build.outputs.tag }}"
            if ! kubectl -n ${{ env.NAMESPACE }} get deployment ${{ env.APP }} >/dev/null 2>&1; then
              echo "deployment/${{ env.APP }} 不存在, 请先执行: kubectl apply -f server/k8s.yaml"
              exit 1
            fi
            kubectl -n ${{ env.NAMESPACE }} set image deployment/${{ env.APP }} \
              ${{ env.APP }}=$IMAGE --record=false
            kubectl -n ${{ env.NAMESPACE }} rollout status deployment/${{ env.APP }} --timeout=300s
            kubectl -n ${{ env.NAMESPACE }} get ingress ${{ env.APP }} \
              -o jsonpath='{.spec.rules[0].host}{"\n"}'