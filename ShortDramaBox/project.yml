name: ShortDramaBox
options:
  bundleIdPrefix: com.duanju
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.17"
    CURRENT_PROJECT_VERSION: "17"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  ShortDramaBox:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 短剧盒子
        CFBundleName: ShortDramaBox
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duanju.box
        PRODUCT_NAME: ShortDramaBox
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # @testable import 要求被测模块开了可测试性。
        # 只给 Debug：Release 出的那个 IPA 不背这个包袱（体积/符号都会变）。
        Debug:
          ENABLE_TESTABILITY: YES
# 单元测试：跑在 iOS 模拟器里（CI 的 macOS runner 有 Xcode + 模拟器）。
  # 用 TEST_HOST 挂到 App 上，测的是被测模块本身。
  # 目录层的那些用例要走服务端：在 App 的 UserDefaults 里配好 `resolver_base`
  # （和取流网关同一处设置）才会真跑，没配就整体跳过。
  ShortDramaBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ShortDramaBox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duanju.box.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ShortDramaBox.app/ShortDramaBox"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ShortDramaBox:
    build:
      targets:
        ShortDramaBox: all
        ShortDramaBoxTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShortDramaBoxTests
    archive:
      config: Release
